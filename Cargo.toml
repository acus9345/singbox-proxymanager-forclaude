[package]
name = "singbox-watch"
version = "1.0.0"
edition = "2021"

[dependencies]
winapi = { version = "0.3", features = [
    "winuser", "wingdi", "winbase", "libloaderapi", "synchapi",
    "tlhelp32", "handleapi", "errhandlingapi", "winreg", "winnt", "winerror",
    "shellapi", "processthreadsapi", "wincon", "processenv", "consoleapi",
    "memoryapi",
] }

[workspace]
# installer/ embeds the release binaries, so it is built after them:
# build-installer.cmd (plain `cargo build` builds just the apps)
members = [".", "installer"]
default-members = ["."]

[profile.release]
lto = true
strip = true
opt-level = "s"
